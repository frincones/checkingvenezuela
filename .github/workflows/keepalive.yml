name: Keepalive Supabase

# Supabase Free pauses projects after 7 days of inactivity. This workflow
# runs every 4 days, hits the database with a trivial query and the
# storage bucket with a HEAD, so neither piece is considered idle.
# Also prevents GitHub from auto-disabling this scheduled workflow at the
# 60-day-no-activity mark.
on:
  schedule:
    - cron: '17 9 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install psql + rclone
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | \
            sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || \
            sudo apt-get install -y -qq postgresql-client-16 || \
            sudo apt-get install -y -qq postgresql-client-15

      - name: Ping the database
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -At -c "SELECT 'keepalive ok at ' || now()::text"
