name: Daily Backup

# Daily cron + manual + external trigger.
# - schedule: every day at 05:37 UTC (off the hour to dodge GH cron drift).
# - workflow_dispatch: button in the Actions tab.
# - repository_dispatch: hit POST /repos/{owner}/{repo}/dispatches from
#   cron-job.org (free) for a reliable extra trigger.
#
# Retention policy (see Final summary step):
# - Keep ALL releases from the last 7 days  → daily granularity.
# - Keep the oldest release of each month   → monthly granularity, cap 1 year.
# - Delete anything older than 365 days.
# Net: ~18 releases stored, ~5.5 GB after 1 year.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-backup]

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # required for the keep-alive heartbeat commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Postgres-17 client + rclone + age + gh
        run: |
          set -euo pipefail
          # Postgres 17 client (Supabase is on PG 17 in 2026)
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | \
            sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || \
            sudo apt-get install -y -qq postgresql-client-16 || \
            sudo apt-get install -y -qq postgresql-client-15
          # rclone — pinned to ≤1.67 because newer versions break Supabase S3 signing
          curl -fsSL https://downloads.rclone.org/v1.67.0/rclone-v1.67.0-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -qq -o /tmp/rclone.zip -d /tmp/rclone
          sudo install /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone
          # age (encryption)
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz | \
            sudo tar -xz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          # Vercel CLI
          npm i -g vercel@latest --silent
          echo "Tool versions:"
          pg_dump --version | head -1
          rclone version | head -1
          age --version
          vercel --version

      - name: Stamp + workspace
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p out/db out/storage out/vercel
          echo "Backup stamp: $STAMP"

      - name: Dump Postgres (schema + data via Session Pooler)
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: '5432'
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          # Pass 1 — role names (informational; restore uses platform-managed roles).
          psql -At -c "SELECT rolname FROM pg_roles WHERE rolname NOT LIKE 'pg_%' ORDER BY 1" \
            > out/db/roles-$STAMP.txt

          # Pass 2 — schema DDL for public + storage (tables, RLS, funcs, triggers).
          pg_dump \
            --schema=public \
            --schema=storage \
            -s --no-owner --no-privileges \
            -f out/db/schema-$STAMP.sql

          # Pass 3 — data for public + storage (custom format).
          pg_dump \
            --schema=public \
            --schema=storage \
            -Fc --no-owner --no-privileges \
            -f out/db/data-$STAMP.dump

          ls -lh out/db/

      - name: Export auth.users via Supabase Admin API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # The pg_dump role on Supabase Free cannot read `auth.*` directly.
          # The Auth Admin API (service_role JWT) returns user rows as JSON.
          # We page through until empty. NOTE: password hashes are NOT returned
          # by this endpoint by design — see RESTORE_RUNBOOK §3.4.

          # Derive SUPABASE_URL from the project ref if env var was not set.
          if [ -z "${SUPABASE_URL:-}" ]; then
            REF=$(python -c "
          import base64,json
          jwt=\"$SRK\"
          payload = jwt.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print(json.loads(base64.urlsafe_b64decode(payload))['ref'])
          ")
            SUPABASE_URL="https://$REF.supabase.co"
          fi
          echo "Using $SUPABASE_URL/auth/v1/admin/users"

          PAGE=1
          PER_PAGE=1000
          OUT="out/db/auth-users-$STAMP.json"
          echo '{"users":[]}' > "$OUT"

          while :; do
            RESP=$(curl -sfSL \
              -H "apikey: $SRK" \
              -H "Authorization: Bearer $SRK" \
              "$SUPABASE_URL/auth/v1/admin/users?page=$PAGE&per_page=$PER_PAGE")
            COUNT=$(echo "$RESP" | python -c "import json,sys; print(len(json.load(sys.stdin).get('users',[])))")
            echo "  page=$PAGE count=$COUNT"
            if [ "$COUNT" = "0" ]; then break; fi
            # Merge users into the accumulator.
            python - <<PYEOF
          import json
          acc = json.load(open("$OUT"))
          new = json.loads("""$RESP""").get("users", [])
          acc["users"].extend(new)
          json.dump(acc, open("$OUT","w"), indent=2)
          PYEOF
            if [ "$COUNT" -lt "$PER_PAGE" ]; then break; fi
            PAGE=$((PAGE+1))
            # Safety stop in case of an API loop.
            if [ "$PAGE" -gt 50 ]; then
              echo "WARNING: stopped after 50 pages (~50k users). Bump if you legitimately have more."
              break
            fi
          done

          # Summary
          TOTAL=$(python -c "import json; print(len(json.load(open('$OUT'))['users']))")
          echo "Auth users backed up: $TOTAL"
          du -h "$OUT"

      - name: Configure rclone for Supabase S3
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [supa]
          type = s3
          provider = Other
          endpoint = ${{ secrets.SUPABASE_S3_ENDPOINT }}
          access_key_id = ${{ secrets.SUPABASE_S3_KEY }}
          secret_access_key = ${{ secrets.SUPABASE_S3_SECRET }}
          region = ${{ secrets.SUPABASE_S3_REGION }}
          force_path_style = true
          EOF

      - name: Sync ALL Storage buckets (auto-discover)
        run: |
          set -euo pipefail
          mkdir -p out/storage
          # Discover every bucket the S3 creds can see, then sync each.
          # This auto-covers buckets created in the future (no workflow edit needed).
          BUCKETS=$(rclone lsd supa: --s3-list-version 2 | awk '{print $NF}' | grep -v '^$')
          if [ -z "$BUCKETS" ]; then
            echo "WARNING: no buckets discovered. S3 creds may be wrong or all buckets empty."
            exit 1
          fi
          echo "Buckets to back up:"
          echo "$BUCKETS" | sed 's/^/  - /'
          for B in $BUCKETS; do
            echo
            echo "=== Syncing bucket: $B ==="
            mkdir -p "out/storage/$B"
            rclone sync "supa:$B" "out/storage/$B" \
              --transfers 4 --checkers 8 \
              --s3-list-version 2 \
              --stats=10s --stats-one-line || {
                echo "WARNING: sync of bucket '$B' failed; continuing with the rest."
              }
          done
          echo
          echo "=== Per-bucket size ==="
          du -sh out/storage/*/ 2>/dev/null
          echo "=== Total storage backed up ==="
          du -sh out/storage/

      - name: Pull Vercel env + project metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vercel-pull && cd /tmp/vercel-pull
          mkdir -p .vercel && echo "{}" > .vercel/project.json
          vercel link --yes --project="$VERCEL_PROJECT" --token="$VERCEL_TOKEN" || true

          # Env vars per environment.
          for envname in production preview development; do
            vercel env pull "$GITHUB_WORKSPACE/out/vercel/.env.$envname" \
              --environment=$envname --yes --token="$VERCEL_TOKEN" || \
              echo "  (no $envname env vars to pull, continuing)"
          done
          cp -r .vercel "$GITHUB_WORKSPACE/out/vercel/.vercel" || true

          # Resolve projectId from the link the CLI just created.
          PID=$(python -c "import json; print(json.load(open('.vercel/project.json'))['projectId'])" 2>/dev/null || true)
          ORG=$(python -c "import json; print(json.load(open('.vercel/project.json'))['orgId'])" 2>/dev/null || true)
          echo "Resolved projectId=$PID  orgId=$ORG"

          # Project metadata (framework, build cmd, regions, root dir, etc.)
          if [ -n "$PID" ]; then
            curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$PID" \
              > "$GITHUB_WORKSPACE/out/vercel/project.json" || \
              echo "WARNING: could not pull project metadata"

            # Custom domains attached to this project.
            curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$PID/domains" \
              > "$GITHUB_WORKSPACE/out/vercel/domains.json" || \
              echo "WARNING: could not pull domains"

            # Deployment hooks (URLs that external schedulers may call).
            curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v1/projects/$PID/deploy-hooks" \
              > "$GITHUB_WORKSPACE/out/vercel/deploy-hooks.json" 2>/dev/null || \
              echo "(no deploy hooks endpoint or none configured)"
          fi

          # Account-level domains (some may not be attached to a project yet).
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v5/domains" \
            > "$GITHUB_WORKSPACE/out/vercel/account-domains.json" || \
            echo "WARNING: could not pull account domains"

          ls -la "$GITHUB_WORKSPACE/out/vercel/" || true

      - name: Tar + encrypt with age
        env:
          AGE_PUB: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          tar -cf - out/ | gzip -9 | age -r "$AGE_PUB" > backup-$STAMP.tgz.age
          ls -lh backup-$STAMP.tgz.age
          echo "Encrypted backup size: $(du -h backup-$STAMP.tgz.age | cut -f1)"

      - name: Upload to private backups repo (GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_PAT }}
        run: |
          set -euo pipefail
          # Install gh CLI (always-current)
          type -p gh >/dev/null || (sudo apt-get install -y -qq gh)
          gh release create "backup-$STAMP" backup-$STAMP.tgz.age \
            --repo frincones/backups-checkingvenezuela \
            --title "Backup $STAMP" \
            --notes "Encrypted with age. Components: pg_dump (public+storage schema/data) + auth.users JSON via Admin API + all Storage buckets + Vercel env vars + Vercel project/domains metadata. Retention: last 7 days + 1 per month (cap 1 year)."

      - name: Rotate — tiered retention (7 days daily + monthly, cap 1 year)
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_PAT }}
        run: |
          set -euo pipefail
          # Rotation rules (applied per release, newest first):
          #   age > 365 days                  → delete
          #   age <= 7 days                   → keep (daily granularity)
          #   first release of its month      → keep (monthly granularity)
          #   anything else                   → delete
          # Result: ~7 daily + ~11 monthly = ~18 releases stored long-term.
          #
          # Age is derived from the TAG NAME (`backup-YYYYMMDD-HHMM`) rather
          # than from `gh release list`'s createdAt field. Reason: this repo
          # only receives `gh release create` calls and never new commits,
          # so every git tag points at the same HEAD commit and GitHub
          # reports the same createdAt (the commit date) for every tag.
          # That broke rotation from 2026-06-30 to 2026-07-14: every day
          # all rows tied on age → only the "first of month" survived, so
          # the daily backup from the previous day was deleted.
          gh release list --repo frincones/backups-checkingvenezuela \
            --limit 200 --json tagName > /tmp/releases.json

          python <<'PYEOF'
          import json
          import re
          from datetime import datetime, timezone

          rels = json.load(open('/tmp/releases.json'))
          # Only the workflow's own releases are candidates for rotation.
          # Anything renamed off the `backup-` prefix is preserved forever
          # (intentional opt-out, e.g. for audits or compliance snapshots).
          rels = [r for r in rels if r['tagName'].startswith('backup-')]

          def parse_tag_date(tag):
              # Format: backup-YYYYMMDD-HHMM  → aware UTC datetime.
              m = re.match(r'^backup-(\d{8})-(\d{4})$', tag)
              if not m:
                  return None
              return datetime.strptime(m.group(1) + m.group(2), '%Y%m%d%H%M').replace(tzinfo=timezone.utc)

          # Sort newest first BY REAL DATE derived from the tag name.
          rels = [r for r in rels if parse_tag_date(r['tagName']) is not None]
          rels.sort(key=lambda r: parse_tag_date(r['tagName']), reverse=True)

          now = datetime.now(timezone.utc)
          seen_months = set()
          to_delete = []
          for r in rels:
              created = parse_tag_date(r['tagName'])
              age_days = (now - created).days
              month_key = created.strftime('%Y-%m')
              if age_days > 365:
                  to_delete.append(r['tagName'])
              elif age_days <= 7:
                  pass  # keep: daily window
              elif month_key not in seen_months:
                  seen_months.add(month_key)  # keep: first of its month
              else:
                  to_delete.append(r['tagName'])

          # Trailing newline so `while read` reads the last line reliably.
          with open('/tmp/to_delete.txt', 'w') as f:
              for tag in to_delete:
                  f.write(tag + '\n')
          print(f'Tagged backup-* releases evaluated: {len(rels)}')
          print(f'Will delete: {len(to_delete)}')
          print(f'Will keep:   {len(rels) - len(to_delete)}')
          for tag in to_delete:
              print(f'  → will delete: {tag}')
          PYEOF

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "  Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag \
              --repo frincones/backups-checkingvenezuela || true
          done < /tmp/to_delete.txt

      - name: Final summary
        run: |
          echo "=========================================="
          echo "Backup complete: backup-$STAMP"
          echo "  - DB schema:  $(du -h out/db/schema-$STAMP.sql | cut -f1)"
          echo "  - DB data:    $(du -h out/db/data-$STAMP.dump | cut -f1)"
          echo "  - Storage:    $(du -sh out/storage/ | cut -f1)"
          echo "  - Encrypted:  $(du -h backup-$STAMP.tgz.age | cut -f1)"
          echo "Release URL: https://github.com/frincones/backups-checkingvenezuela/releases/tag/backup-$STAMP"
          echo "=========================================="
